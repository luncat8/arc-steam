<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2D Noise Resource Generator</title>
<style>
body { font-family: monospace; background: #1a1a1a; color: #ccc; margin: 0; padding: 10px; }
h1 { font-size: 16px; margin: 5px 0; }
#canvas { border: 1px solid #444; image-rendering: pixelated; display: block; margin-bottom: 8px; }
#histCanvas { border: 1px solid #444; margin-bottom: 10px; }
#histCanvas[hidden] { display: none; }
.controls { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
button { background: #333; color: #ccc; border: 1px solid #555; padding: 6px 12px; cursor: pointer; font-family: monospace; }
button:hover { background: #444; }
#settings { width: 100%; height: 80px; background: #222; color: #aaa; border: 1px solid #444; padding: 5px; font-size: 11px; resize: vertical; margin-bottom: 10px; box-sizing: border-box; }
.resource-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; background: #222; padding: 4px 8px; border-radius: 3px; }
.resource-name { width: 180px; font-size: 12px; color: #fff; flex-shrink: 0; }
.resource-color { width: 16px; height: 16px; border-radius: 2px; flex-shrink: 0; }
.slider-group { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
.slider-label { font-size: 10px; width: 12px; color: #888; text-align: center; }
.range-slider { position: relative; height: 16px; background: #333; border-radius: 2px; cursor: pointer; flex: 1; min-width: 0; user-select: none; }
.range-fill { position: absolute; top: 0; bottom: 0; background: #5588cc; opacity: 0.4; border-radius: 2px; pointer-events: none; }
.handle { position: absolute; top: -2px; width: 6px; height: 20px; background: #fff; border-radius: 1px; cursor: ew-resize; z-index: 2; transform: translateX(-50%); }
.handle:hover { background: #ffff88; }
.slider-value { font-size: 10px; color: #aaa; width: 80px; text-align: right; flex-shrink: 0; }
.stats { font-size: 11px; color: #888; margin-bottom: 10px; line-height: 1.6; }
.stats span { display: block; }
.status { font-size: 11px; color: #8cc; min-height: 14px; margin-bottom: 5px; }
</style>
</head>
<body>
<canvas id="canvas" width="512" height="512"></canvas>
<canvas id="histCanvas" width="512" height="150" hidden></canvas>
<div class="controls">
	<button id="btnGenerate">Generate</button>
	<button id="btnAuto">Auto-adjust ranges</button>
	<button id="btnCopy">Copy settings (JSON)</button>
	<button id="btnPaste">Paste settings</button>
	<label style="font-size:12px;display:flex;align-items:center;gap:4px;">
		<input type="checkbox" id="showHistogram"> Show channel histograms
	</label>
</div>
<div class="status" id="status"></div>
<div class="stats" id="stats"></div>
<div id="sliders"></div>
<textarea id="settings" placeholder="Settings JSON appears here. Paste JSON and click Paste settings."></textarea>

<script>
// Constants
const W = 512, H = 512, N = W * H;
let SCALE = 0.02;
let Y_COMPRESS = 3;
const SEEDS = { r: 1, g: 2, b: 3 };
const CH = ["r", "g", "b"];
const MIN_WIDTH = 0.01;

// Resource definitions (first-match-wins classification)
const resources = [
	{ id: "silver", name: "Native silver", formula: "Ag", rarity: "rare", color: "#c0c0c0", r: [0.31, 0.36], g: [0.31, 0.36], b: [0.31, 0.36] },
	{ id: "gold", name: "Native gold", formula: "Au", rarity: "rare", color: "#ffd700", r: [0.45, 0.50], g: [0.35, 0.40], b: [0.10, 0.15] },
	{ id: "copper_ore", name: "Copper ore (CuS)", formula: "CuFeS2", rarity: "uncommon", color: "#b87333", r: [0.40, 0.50], g: [0.35, 0.45], b: [0.10, 0.20] },
	{ id: "iron_ore", name: "Iron ore (Fe2O3)", formula: "Fe2O3", rarity: "common", color: "#8b4513", r: [0.50, 0.60], g: [0.20, 0.30], b: [0.15, 0.25] },
	{ id: "quartz", name: "Quartz (SiO2)", formula: "SiO2", rarity: "common", color: "#f0f0f0", r: [0.30, 0.35], g: [0.30, 0.35], b: [0.30, 0.35] },
	{ id: "fluorite", name: "Fluorite (CaF2)", formula: "CaF2", rarity: "uncommon", color: "#9370db", r: [0.10, 0.30], g: [0.00, 0.20], b: [0.70, 0.90] },
	{ id: "gas", name: "Gas (O2)", formula: "O2", rarity: "common", color: "#add8e6", r: [0.00, 0.05], g: [0.00, 0.05], b: [0.95, 1.00] },
	{ id: "other", name: "Other / stone", formula: null, rarity: null, color: "#666666", r: null, g: null, b: null }
];
const OTHER = resources.length - 1;
const targetPct = { rare: 2, uncommon: 7, common: 15 };

// DOM elements
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const histCanvas = document.getElementById("histCanvas");
const statsEl = document.getElementById("stats");
const statusEl = document.getElementById("status");
const settingsBox = document.getElementById("settings");
const slidersEl = document.getElementById("sliders");
const histToggle = document.getElementById("showHistogram");

// Utilities
function clamp01(v) { return Math.min(1, Math.max(0, v)); }
function fmtRange(rg) { return `${rg[0].toFixed(2)}–${rg[1].toFixed(2)}`; }
function setStatus(msg) { statusEl.textContent = msg; }
function hexToRgb(hex) {
	return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function isValidHex(s) { return typeof s === "string" && /^#[0-9a-fA-F]{6}$/.test(s); }
function isValidRange(rg) {
	return Array.isArray(rg) && rg.length === 2 && rg.every(Number.isFinite) && rg[0] <= rg[1];
}

// Simplex noise (Gustavson-style, 2D)
const SQ = Math.SQRT1_2;
const GRAD = [[1,0],[-1,0],[0,1],[0,-1],[SQ,SQ],[-SQ,SQ],[SQ,-SQ],[-SQ,-SQ]];
const F2 = 0.5 * (Math.sqrt(3.0) - 1.0);
const G2 = (3.0 - Math.sqrt(3.0)) / 6.0;

// mulberry32: a small, well-mixed PRNG so seeds 1, 2, 3 give unrelated permutations
function mulberry32(a) {
	return function() {
		a |= 0; a = (a + 0x6D2B79F5) | 0;
		let t = Math.imul(a ^ (a >>> 15), 1 | a);
		t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
		return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
	};
}

function createNoise(seed) {
	const rand = mulberry32(seed);
	const p = new Uint8Array(256);
	for (let i = 0; i < 256; i++) p[i] = i;
	for (let i = 255; i > 0; i--) {
		const j = Math.floor(rand() * (i + 1));
		const t = p[i]; p[i] = p[j]; p[j] = t;
	}
	const perm = new Uint8Array(512);
	for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

	function corner(px, py, gi) {
		let t = 0.5 - px * px - py * py;
		if (t < 0) return 0;
		t *= t;
		const g = GRAD[gi];
		return t * t * (g[0] * px + g[1] * py);
	}

	return function(x, y) {
		const s2 = (x + y) * F2;
		const i = Math.floor(x + s2), j = Math.floor(y + s2);
		const t = (i + j) * G2;
		const x0 = x - (i - t), y0 = y - (j - t);

		const i1 = x0 > y0 ? 1 : 0, j1 = 1 - i1;
		const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2;
		const x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;

		const ii = i & 255, jj = j & 255;
		const n0 = corner(x0, y0, perm[ii + perm[jj]] & 7);
		const n1 = corner(x1, y1, perm[ii + i1 + perm[jj + j1]] & 7);
		const n2 = corner(x2, y2, perm[ii + 1 + perm[jj + 1]] & 7);

		return 70.0 * (n0 + n1 + n2);
	};
}

// Cached noise fields
const fields = { r: new Float32Array(N), g: new Float32Array(N), b: new Float32Array(N) };

function buildFields() {
	for (const ch of CH) {
		const noise = createNoise(SEEDS[ch]);
		const f = fields[ch];
		for (let y = 0; y < H; y++) {
			for (let x = 0; x < W; x++) {
				const v = noise(x * SCALE, y * SCALE * Y_COMPRESS);
				f[y * W + x] = clamp01((v + 1) / 2);
			}
		}
	}
	// Normalize so r+g+b = 1 per pixel
	for (let k = 0; k < N; k++) {
		const sum = fields.r[k] + fields.g[k] + fields.b[k];
		if (sum > 0.001) {
			fields.r[k] /= sum; fields.g[k] /= sum; fields.b[k] /= sum;
		} else {
			fields.r[k] = fields.g[k] = fields.b[k] = 1 / 3;
		}
	}
}

// Classification (first-match-wins)
function inRange(v, rg) { return !rg || (v >= rg[0] && v <= rg[1]); }

function classify(r, g, b) {
	for (let i = 0; i < OTHER; i++) {
		const res = resources[i];
		if (inRange(r, res.r) && inRange(g, res.g) && inRange(b, res.b)) return i;
	}
	return OTHER;
}

function classifyAll() {
	const idx = new Uint8Array(N);
	const counts = new Array(resources.length).fill(0);
	for (let k = 0; k < N; k++) {
		const c = classify(fields.r[k], fields.g[k], fields.b[k]);
		idx[k] = c;
		counts[c]++;
	}
	return { idx, counts };
}

// Rendering
function generate() {
	const { idx, counts } = classifyAll();
	const rgb = resources.map(r => hexToRgb(r.color));

	const img = ctx.createImageData(W, H);
	const d = img.data;
	for (let k = 0; k < N; k++) {
		const c = rgb[idx[k]];
		const o = k * 4;
		d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
	}
	ctx.putImageData(img, 0, 0);

	renderStats(counts);
	histCanvas.hidden = !histToggle.checked;
	if (histToggle.checked) drawHistogram();
}

function renderStats(counts) {
	statsEl.textContent = "";
	resources.forEach((res, i) => {
		const span = document.createElement("span");
		span.textContent = `${res.name}: ${(counts[i] / N * 100).toFixed(2)}%`;
		statsEl.appendChild(span);
	});
}

function drawHistogram() {
	const c = histCanvas.getContext("2d");
	const w = histCanvas.width, h = histCanvas.height;
	const BINS = 64;
	const colors = { r: "#e05050", g: "#50c050", b: "#5080ff" };

	const bins = { r: new Uint32Array(BINS), g: new Uint32Array(BINS), b: new Uint32Array(BINS) };
	for (const ch of CH) {
		const f = fields[ch], bn = bins[ch];
		for (let k = 0; k < N; k++) {
			bn[Math.min(BINS - 1, (f[k] * BINS) | 0)]++;
		}
	}

	let max = 1;
	for (const ch of CH) for (let b = 0; b < BINS; b++) max = Math.max(max, bins[ch][b]);

	c.fillStyle = "#1a1a1a";
	c.fillRect(0, 0, w, h);

	const bw = w / BINS;
	c.globalAlpha = 0.6;
	for (const ch of CH) {
		c.fillStyle = colors[ch];
		for (let b = 0; b < BINS; b++) {
			const bh = bins[ch][b] / max * (h - 24);
			c.fillRect(b * bw, h - 10 - bh, bw - 1, bh);
		}
	}
	c.globalAlpha = 1;
	c.fillStyle = "#aaa";
	c.font = "11px monospace";
	c.fillText("Normalized R / G / B distribution (all pixels, 0 to 1)", 5, 12);
}

// Auto-adjust: scale ranges toward target frequencies
const MIN_HALF = MIN_WIDTH / 2;
function scaleRange(res, factor) {
	for (const ch of CH) {
		const rg = res[ch];
		if (!rg) continue;
		const center = (rg[0] + rg[1]) / 2;
		let half = (rg[1] - rg[0]) / 2 * factor;
		if (half < MIN_HALF) half = MIN_HALF;
		rg[0] = clamp01(center - half);
		rg[1] = clamp01(center + half);
	}
}

function autoAdjust() {
	setStatus("Auto-adjusting...");
	let iter = 0;
	let stable = false;
	while (iter < 15 && !stable) {
		iter++;
		const { counts } = classifyAll();
		let changed = false;

		for (let i = 0; i < OTHER; i++) {
			const res = resources[i];
			if (!res.rarity) continue;
			const target = N * targetPct[res.rarity] / 100;
			const ratio = counts[i] / target;

			if (ratio < 0.5) { scaleRange(res, 1.2); changed = true; }
			else if (ratio > 1.5) { scaleRange(res, 0.9); changed = true; }
		}
		stable = !changed;
	}
	buildSliders();
	generate();
	setStatus(stable
		? `Auto-adjust converged after ${iter} iteration(s)`
		: `Auto-adjust stopped at ${iter} iterations (not fully converged)`);
}

// Dual-handle range slider (drag on handles OR anywhere on the track)
function createRangeSlider(min, max, onChange) {
	const slider = document.createElement("div");
	slider.className = "range-slider";

	const fill = document.createElement("div");
	fill.className = "range-fill";
	slider.appendChild(fill);

	const handleMin = document.createElement("div");
	handleMin.className = "handle";
	slider.appendChild(handleMin);

	const handleMax = document.createElement("div");
	handleMax.className = "handle";
	slider.appendChild(handleMax);

	let dragging = null;
	const GAP = 0.01;

	function updatePositions() {
		fill.style.left = (min * 100) + "%";
		fill.style.width = ((max - min) * 100) + "%";
		handleMin.style.left = (min * 100) + "%";
		handleMax.style.left = (max * 100) + "%";
	}

	function posFromEvent(e) {
		const rect = slider.getBoundingClientRect();
		return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
	}

	function apply(pos, which) {
		if (which === "min") min = Math.min(pos, max - GAP);
		else max = Math.max(pos, min + GAP);
		updatePositions();
		onChange(min, max);
	}

	function onMove(e) {
		if (dragging) apply(posFromEvent(e), dragging);
	}

	function onUp() {
		dragging = null;
		document.removeEventListener("mousemove", onMove);
		document.removeEventListener("mouseup", onUp);
	}

	function startDrag(e, which) {
		e.preventDefault();
		e.stopPropagation();
		dragging = which;
		document.addEventListener("mousemove", onMove);
		document.addEventListener("mouseup", onUp);
	}

	handleMin.addEventListener("mousedown", (e) => startDrag(e, "min"));
	handleMax.addEventListener("mousedown", (e) => startDrag(e, "max"));

	// Click or drag on the track: move the nearest handle and keep dragging it
	slider.addEventListener("mousedown", (e) => {
		const pos = posFromEvent(e);
		const which = Math.abs(pos - min) < Math.abs(pos - max) ? "min" : "max";
		apply(pos, which);
		startDrag(e, which);
	});

	updatePositions();
	return slider;
}

function buildSliders() {
	slidersEl.innerHTML = "";

	for (let i = 0; i < OTHER; i++) {
		const res = resources[i];
		const row = document.createElement("div");
		row.className = "resource-row";

		const colorBox = document.createElement("div");
		colorBox.className = "resource-color";
		colorBox.style.background = res.color;
		row.appendChild(colorBox);

		const nameEl = document.createElement("span");
		nameEl.className = "resource-name";
		nameEl.textContent = `${res.name} (${res.rarity})`;
		row.appendChild(nameEl);

		for (const ch of CH) {
			if (!res[ch]) continue;
			const group = document.createElement("div");
			group.className = "slider-group";

			const label = document.createElement("span");
			label.className = "slider-label";
			label.textContent = ch.toUpperCase();
			group.appendChild(label);

			const valueEl = document.createElement("span");
			valueEl.className = "slider-value";
			valueEl.textContent = fmtRange(res[ch]);

			const slider = createRangeSlider(res[ch][0], res[ch][1], (min, max) => {
				res[ch][0] = min;
				res[ch][1] = max;
				valueEl.textContent = fmtRange([min, max]);
			});
			group.appendChild(slider);
			group.appendChild(valueEl);

			row.appendChild(group);
		}

		slidersEl.appendChild(row);
	}
}

function buildSettingsObject() {
	return {
		resources: resources.map(r => ({
			id: r.id, name: r.name, formula: r.formula, rarity: r.rarity, color: r.color,
			r: r.r ? [r.r[0], r.r[1]] : null,
			g: r.g ? [r.g[0], r.g[1]] : null,
			b: r.b ? [r.b[0], r.b[1]] : null
		})),
		scale: SCALE,
		y_compress: Y_COMPRESS
	};
}

function copySettings() {
	const json = JSON.stringify(buildSettingsObject(), null, 2);
	settingsBox.value = json;
	if (!navigator.clipboard) {
		setStatus("Clipboard unavailable here; copy the JSON from the box manually");
		return;
	}
	navigator.clipboard.writeText(json).then(
		() => setStatus("Settings copied to clipboard"),
		(err) => setStatus("Failed to copy: " + err.message)
	);
}

function pasteSettings() {
	const text = settingsBox.value.trim();
	if (!text) { setStatus("Nothing to paste"); return; }

	let settings;
	try {
		settings = JSON.parse(text);
	} catch (e) {
		setStatus("Invalid JSON: " + e.message);
		return;
	}
	if (!settings || !Array.isArray(settings.resources)) {
		setStatus("Invalid settings: missing 'resources' array");
		return;
	}

	// Validate everything before touching the current state
	for (const src of settings.resources) {
		if (src.color !== undefined && !isValidHex(src.color)) {
			setStatus(`Invalid color for ${src.id}`); return;
		}
		for (const ch of CH) {
			if (src[ch] != null && !isValidRange(src[ch])) {
				setStatus(`Invalid ${ch.toUpperCase()} range for ${src.id} (need [min, max] with min <= max)`);
				return;
			}
		}
	}
	if (settings.scale !== undefined && !(Number.isFinite(settings.scale) && settings.scale > 0)) {
		setStatus("Invalid scale (must be a positive number)"); return;
	}
	if (settings.y_compress !== undefined && !(Number.isFinite(settings.y_compress) && settings.y_compress > 0)) {
		setStatus("Invalid y_compress (must be a positive number)"); return;
	}

	// Apply
	for (const src of settings.resources) {
		const dst = resources.find(r => r.id === src.id);
		if (!dst) continue;
		if (src.name !== undefined) dst.name = src.name;
		if (src.formula !== undefined) dst.formula = src.formula;
		if (src.rarity !== undefined) dst.rarity = src.rarity;
		if (src.color !== undefined) dst.color = src.color;
		for (const ch of CH) {
			dst[ch] = src[ch] != null ? [src[ch][0], src[ch][1]] : null;
		}
	}

	let fieldsChanged = false;
	if (settings.scale !== undefined && settings.scale !== SCALE) { SCALE = settings.scale; fieldsChanged = true; }
	if (settings.y_compress !== undefined && settings.y_compress !== Y_COMPRESS) { Y_COMPRESS = settings.y_compress; fieldsChanged = true; }
	if (fieldsChanged) buildFields();

	buildSliders();
	generate();
	setStatus("Settings pasted and applied");
}

// Event wiring (no inline onclick handlers)
document.getElementById("btnGenerate").addEventListener("click", generate);
document.getElementById("btnAuto").addEventListener("click", autoAdjust);
document.getElementById("btnCopy").addEventListener("click", copySettings);
document.getElementById("btnPaste").addEventListener("click", pasteSettings);
histToggle.addEventListener("change", function() {
	histCanvas.hidden = !this.checked;
	if (this.checked) drawHistogram();
});

// Init
buildFields();
buildSliders();
generate();
</script>
</body>
</html>
